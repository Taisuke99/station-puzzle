<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ステーションパズル</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  color: #fff;
}
#ui {
  width: 400px;
  max-width: 100vw;
  padding: 6px 10px 3px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
#row1 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: #aaa;
}
#row1 .val { font-size: 14px; color: #fff; font-weight: bold; }
#mission { text-align: center; font-size: 12px; color: #7ec8e3; }
#budget-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #aaa;
}
#budget-track {
  flex: 1; height: 5px; background: #333; border-radius: 3px; overflow: hidden;
}
#budget-fill {
  height: 100%; background: #f0ad4e; border-radius: 3px; transition: width 0.2s;
}
#budget-num { font-size: 12px; color: #f0ad4e; font-weight: bold; min-width: 42px; text-align: right; }
#dir-section { display: flex; gap: 6px; flex-wrap: wrap; }
.dir-ctrl {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; color: #aaa; flex: 1; min-width: 110px;
}
.dir-ctrl input[type=range] { flex: 1; height: 3px; accent-color: #7ec8e3; }
.dir-angle { font-size: 10px; color: #7ec8e3; min-width: 26px; text-align: right; }
#controls { display: flex; gap: 5px; justify-content: center; }
button {
  padding: 6px 10px; border: none; border-radius: 5px;
  font-size: 11px; cursor: pointer; font-family: inherit; font-weight: bold;
  transition: opacity 0.15s, transform 0.1s; white-space: nowrap;
}
button:active { transform: scale(0.95); }
#btn-draw  { background: #4a90d9; color: #fff; }
#btn-erase { background: #e07070; color: #fff; }
#btn-toggle { background: #5cb85c; color: #fff; }
#btn-reset { background: #555; color: #ccc; }
button.active { outline: 2px solid #fff; opacity: 1; }
button:not(.active) { opacity: 0.72; }
#canvas-wrap { position: relative; width: 400px; max-width: 100vw; }
canvas { display: block; width: 400px; max-width: 100vw; cursor: crosshair; touch-action: none; }
#overlay {
  display: none; position: absolute; inset: 0;
  background: rgba(0,0,0,0.78);
  flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
#overlay.show { display: flex; }
#overlay-title { font-size: 28px; font-weight: bold; }
#overlay-sub { font-size: 13px; color: #ccc; }
#overlay-btn {
  padding: 10px 26px; background: #5cb85c; color: #fff;
  border: none; border-radius: 8px; font-size: 14px; font-weight: bold;
  cursor: pointer; font-family: inherit;
}
</style>
</head>
<body>

<div id="ui">
  <div id="row1">
    <div>STAGE <span class="val" id="stage-num">1</span></div>
    <div>到達: <span class="val"><span id="exit-count">0</span> / <span id="target-num">5</span></span></div>
    <div>投入: <span class="val"><span id="spawned-num">0</span> / <span id="total-num">10</span></span></div>
  </div>
  <div id="mission">出口に <span id="m-target">5</span> 個送り込め！</div>
  <div id="budget-bar">
    <span>予算</span>
    <div id="budget-track"><div id="budget-fill" style="width:100%"></div></div>
    <span id="budget-num">300pt</span>
  </div>
  <div id="dir-section"></div>
  <div id="controls">
    <button id="btn-draw" class="active">✏️ 描く</button>
    <button id="btn-erase">✂️ 消す</button>
    <button id="btn-toggle">▶ 開始</button>
    <button id="btn-reset">↺ リセット</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas" width="400" height="510"></canvas>
  <div id="overlay">
    <div id="overlay-title">🎉 クリア！</div>
    <div id="overlay-sub"></div>
    <button id="overlay-btn">次へ →</button>
  </div>
</div>

<script>
// ── 定数 ─────────────────────────────────────────────────────
const W = 400, H = 510;
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

const GRAVITY    = 0.38;
const RESTITUTION = 0.46;
const FRICTION_T  = 0.88; // tangential friction on collision
const FRICTION_AIR = 0.9995;
const BALL_R      = 10;
const BALL_SPEED  = 3.8;

// ── ステージ ────────────────────────────────────────────────
const STAGES = [
  {
    id:1, totalBalls:10, target:5, spawnInterval:1200, budget:300,
    ballCost:5, wallCostPerPx:0.4,
    entrances:[{x:200, y:30}],
    exits:[{x:140, y:H-12, w:120, color:'#5cb85c', label:'OUT'}],
    obstacles:[],
  },
  {
    id:2, totalBalls:15, target:10, spawnInterval:900, budget:280,
    ballCost:5, wallCostPerPx:0.4,
    entrances:[{x:100, y:30},{x:300, y:30}],
    exits:[{x:155, y:H-12, w:90, color:'#f0ad4e', label:'OUT'}],
    obstacles:[
      {x:80,  y:180, w:80, h:14, angle: 0.3},
      {x:280, y:245, w:80, h:14, angle:-0.3},
      {x:175, y:355, w:60, h:14, angle: 0},
    ],
  },
  {
    id:3, totalBalls:20, target:15, spawnInterval:800, budget:240,
    ballCost:4, wallCostPerPx:0.4,
    entrances:[{x:200, y:30}],
    exits:[
      {x:60,  y:H-12, w:80, color:'#d9534f', label:'A'},
      {x:270, y:H-12, w:80, color:'#5bc0de', label:'B'},
    ],
    obstacles:[
      {x:200, y:275, w:16, h:110, angle:0},
      {x:88,  y:395, w:70, h:14,  angle: 0.2},
      {x:312, y:395, w:70, h:14,  angle:-0.2},
    ],
  },
];

// ── 状態 ─────────────────────────────────────────────────────
let stageIndex = 0, stage;
let balls = [], userWalls = [], obsSegs = [];
let mode = 'draw', isRunning = false, isPaused = false;
let spawnTimer = null, spawnedCount = 0, exitCount = 0;
let remainingBudget = 0, maxBudget = 0;
let currentDraw = null, gameOver = false;
let entranceAngles = [];
let loopStarted = false;

// ── 物理ヘルパー ─────────────────────────────────────────────
function rotate(x, y, a, ox, oy) {
  const c = Math.cos(a), s = Math.sin(a);
  return {x: ox + x*c - y*s, y: oy + x*s + y*c};
}

function rectToSegs(cx, cy, w, h, a) {
  const hw = w/2, hh = h/2;
  const p = [
    rotate(-hw,-hh,a,cx,cy), rotate(hw,-hh,a,cx,cy),
    rotate( hw, hh,a,cx,cy), rotate(-hw,hh,a,cx,cy),
  ];
  return [
    {x1:p[0].x,y1:p[0].y,x2:p[1].x,y2:p[1].y},
    {x1:p[1].x,y1:p[1].y,x2:p[2].x,y2:p[2].y},
    {x1:p[2].x,y1:p[2].y,x2:p[3].x,y2:p[3].y},
    {x1:p[3].x,y1:p[3].y,x2:p[0].x,y2:p[0].y},
  ];
}

function resolveCircleSeg(ball, seg) {
  const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
  const lenSq = dx*dx + dy*dy;
  if (lenSq < 0.001) return;
  const t = Math.max(0, Math.min(1, ((ball.x-seg.x1)*dx + (ball.y-seg.y1)*dy) / lenSq));
  const cx = seg.x1 + t*dx, cy = seg.y1 + t*dy;
  const ddx = ball.x - cx, ddy = ball.y - cy;
  const dist = Math.sqrt(ddx*ddx + ddy*ddy);
  if (dist < BALL_R && dist > 0.001) {
    const nx = ddx/dist, ny = ddy/dist;
    ball.x += nx*(BALL_R - dist);
    ball.y += ny*(BALL_R - dist);
    const dot = ball.vx*nx + ball.vy*ny;
    if (dot < 0) {
      ball.vx -= (1 + RESTITUTION)*dot*nx;
      ball.vy -= (1 + RESTITUTION)*dot*ny;
      const tx = -ny, ty = nx;
      const tdot = ball.vx*tx + ball.vy*ty;
      ball.vx -= (1 - FRICTION_T)*tdot*tx;
      ball.vy -= (1 - FRICTION_T)*tdot*ty;
    }
  }
}

// ── 初期化 ───────────────────────────────────────────────────
function initStage() {
  stage = STAGES[stageIndex];
  balls = []; userWalls = []; obsSegs = [];
  spawnedCount = 0; exitCount = 0;
  isRunning = false; isPaused = false; gameOver = false;
  currentDraw = null;
  clearInterval(spawnTimer);

  maxBudget = remainingBudget = stage.budget;
  entranceAngles = stage.entrances.map(() => 0);

  // 境界
  obsSegs.push(
    {x1:0,   y1:0, x2:0,   y2:H},
    {x1:W,   y1:0, x2:W,   y2:H},
    {x1:0,   y1:H, x2:W,   y2:H},
  );
  // 障害物のセグメント
  stage.obstacles.forEach(o => obsSegs.push(...rectToSegs(o.x, o.y, o.w, o.h, o.angle||0)));

  buildDirectionUI();
  updateUI();

  document.getElementById('overlay').classList.remove('show');
  document.getElementById('btn-toggle').textContent = '▶ 開始';
  document.getElementById('btn-toggle').style.background = '#5cb85c';

  if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }
}

// ── 方向UI ───────────────────────────────────────────────────
function buildDirectionUI() {
  const sec = document.getElementById('dir-section');
  sec.innerHTML = '';
  stage.entrances.forEach((e, i) => {
    const lbl = stage.entrances.length > 1 ? `入口${i+1}` : '角度';
    const div = document.createElement('div');
    div.className = 'dir-ctrl';
    const l = document.createElement('label'); l.textContent = lbl;
    const sl = document.createElement('input');
    sl.type='range'; sl.min=-60; sl.max=60; sl.value=0; sl.step=5;
    const sp = document.createElement('span');
    sp.className='dir-angle'; sp.textContent='0°';
    sl.oninput = () => {
      const d = parseInt(sl.value);
      entranceAngles[i] = d * Math.PI / 180;
      sp.textContent = d + '°';
    };
    div.append(l, sl, sp);
    sec.appendChild(div);
  });
}

// ── UI更新 ───────────────────────────────────────────────────
function updateUI() {
  document.getElementById('stage-num').textContent   = stage.id;
  document.getElementById('target-num').textContent  = stage.target;
  document.getElementById('total-num').textContent   = stage.totalBalls;
  document.getElementById('m-target').textContent    = stage.target;
  document.getElementById('exit-count').textContent  = exitCount;
  document.getElementById('spawned-num').textContent = spawnedCount;
  const pct = Math.max(0, remainingBudget / maxBudget * 100);
  document.getElementById('budget-fill').style.width = pct + '%';
  document.getElementById('budget-fill').style.background = pct > 40 ? '#f0ad4e' : '#e07070';
  document.getElementById('budget-num').textContent  = Math.max(0,remainingBudget) + 'pt';
}

// ── 玉スポーン ────────────────────────────────────────────────
function spawnBall() {
  if (gameOver) return;
  if (spawnedCount >= stage.totalBalls) {
    clearInterval(spawnTimer);
    setTimeout(checkEnd, 3000);
    return;
  }
  if (remainingBudget < stage.ballCost) {
    clearInterval(spawnTimer);
    setTimeout(checkEnd, 2000);
    return;
  }
  const idx = spawnedCount % stage.entrances.length;
  const src = stage.entrances[idx];
  const ang = entranceAngles[idx] || 0;
  const jitter = (Math.random() - 0.5) * 6;
  const hues = [220,160,40,0,280,180];
  balls.push({
    x: src.x + jitter, y: src.y,
    vx: Math.sin(ang)*BALL_SPEED + (Math.random()-0.5)*0.5,
    vy: Math.cos(ang)*BALL_SPEED,
    hue: hues[spawnedCount % hues.length],
  });
  spawnedCount++;
  remainingBudget -= stage.ballCost;
  updateUI();
}

// ── 物理ステップ ──────────────────────────────────────────────
function stepPhysics() {
  const segs = [...obsSegs, ...userWalls];
  for (const ball of balls) {
    ball.vy += GRAVITY * 0.5;
    ball.vx *= FRICTION_AIR;
    ball.vy *= FRICTION_AIR;
    ball.x += ball.vx;
    ball.y += ball.vy;
    for (const seg of segs) resolveCircleSeg(ball, seg);
  }
}

// ── 出口判定 ──────────────────────────────────────────────────
function checkExits() {
  balls = balls.filter(ball => {
    for (const exit of stage.exits) {
      const ex1 = exit.x - exit.w/2, ex2 = exit.x + exit.w/2;
      if (ball.y > H - 36 && ball.x >= ex1 && ball.x <= ex2) {
        exitCount++;
        updateUI();
        if (!gameOver && exitCount >= stage.target && spawnedCount >= stage.totalBalls) {
          gameOver = true; clearInterval(spawnTimer);
          setTimeout(showResult, 600);
        }
        return false;
      }
    }
    if (ball.y > H + 60) {
      if (!gameOver && spawnedCount >= stage.totalBalls && balls.length <= 1) {
        gameOver = true; setTimeout(showResult, 400);
      }
      return false;
    }
    return true;
  });
}

function checkEnd() {
  if (gameOver) return;
  gameOver = true; clearInterval(spawnTimer); showResult();
}

function showResult() {
  const overlay = document.getElementById('overlay');
  const title = document.getElementById('overlay-title');
  const sub   = document.getElementById('overlay-sub');
  const btn   = document.getElementById('overlay-btn');
  if (exitCount >= stage.target) {
    title.textContent = '🎉 クリア！'; title.style.color = '#7ec8e3';
    sub.textContent = exitCount + ' 個を出口に送り込んだ！';
    if (stageIndex < STAGES.length - 1) {
      btn.textContent = '次のステージへ →';
      btn.onclick = () => { stageIndex++; initStage(); };
    } else {
      btn.textContent = '🏆 全ステージ完了！';
      btn.onclick = () => { stageIndex = 0; initStage(); };
    }
  } else {
    title.textContent = '😓 もう一度！'; title.style.color = '#e07070';
    sub.textContent = exitCount + ' 個しか届かなかった（目標: ' + stage.target + '）';
    btn.textContent = 'リトライ →';
    btn.onclick = () => initStage();
  }
  overlay.classList.add('show');
}

// ── 描画 ──────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0f0f1e'; ctx.fillRect(0, 0, W, H);

  // グリッド
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // 入口 + 方向矢印
  stage.entrances.forEach((e, i) => {
    ctx.strokeStyle = '#7ec8e3'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, 13, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(126,200,227,0.15)'; ctx.fill();
    ctx.fillStyle = '#7ec8e3'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('IN', e.x, e.y + 3);

    const ang = entranceAngles[i] || 0;
    const len = 22;
    const ax = e.x + Math.sin(ang)*len, ay = e.y + Math.cos(ang)*len;
    ctx.strokeStyle = 'rgba(126,200,227,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(ax, ay); ctx.stroke();
    const ha = Math.atan2(ay-e.y, ax-e.x);
    ctx.beginPath();
    ctx.moveTo(ax,ay); ctx.lineTo(ax-7*Math.cos(ha-0.4), ay-7*Math.sin(ha-0.4));
    ctx.moveTo(ax,ay); ctx.lineTo(ax-7*Math.cos(ha+0.4), ay-7*Math.sin(ha+0.4));
    ctx.stroke();
  });

  // 出口
  stage.exits.forEach(exit => {
    const x1 = exit.x - exit.w/2;
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = exit.color;
    ctx.fillRect(x1, H-28, exit.w, 28);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = exit.color; ctx.lineWidth = 3;
    ctx.strokeRect(x1, H-28, exit.w, 28);
    ctx.fillStyle = exit.color;
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(exit.label, exit.x, H - 10);
  });

  // 障害物
  stage.obstacles.forEach(o => {
    ctx.save();
    ctx.translate(o.x, o.y); ctx.rotate(o.angle||0);
    ctx.fillStyle = '#c05020';
    ctx.fillRect(-o.w/2, -o.h/2, o.w, o.h);
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
    for (let s = -o.w; s < o.w; s += 8) {
      ctx.beginPath(); ctx.moveTo(s,-o.h/2); ctx.lineTo(s-o.h, o.h/2); ctx.stroke();
    }
    ctx.restore();
  });

  // ユーザー壁
  userWalls.forEach(w => {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(w.x1,w.y1); ctx.lineTo(w.x2,w.y2); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(w.x1,w.y1,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w.x2,w.y2,3,0,Math.PI*2); ctx.fill();
  });

  // 描画プレビュー
  if (currentDraw) {
    const {x1,y1,x2,y2} = currentDraw;
    const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
    const cost = Math.floor(len * stage.wallCostPerPx);
    const ok = remainingBudget >= cost;
    ctx.globalAlpha = ok ? 0.55 : 0.8;
    ctx.strokeStyle = ok ? '#fff' : '#f55'; ctx.lineWidth = 3;
    ctx.setLineDash([6,4]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    if (len > 20) {
      ctx.fillStyle = ok ? '#fff' : '#f55';
      ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('-' + cost + 'pt', (x1+x2)/2, (y1+y2)/2 - 8);
    }
  }

  // 玉
  balls.forEach(ball => {
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI*2);
    const g = ctx.createRadialGradient(ball.x-3, ball.y-3, 1, ball.x, ball.y, BALL_R);
    g.addColorStop(0, 'hsl('+ball.hue+',80%,82%)');
    g.addColorStop(1, 'hsl('+ball.hue+',70%,50%)');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'hsl('+ball.hue+',60%,38%)'; ctx.lineWidth = 1; ctx.stroke();
  });

  // 予算切れ赤み
  if (remainingBudget <= 0 && !gameOver) {
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#f00'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
}

// ── メインループ ──────────────────────────────────────────────
let lastTime = 0;
function loop(time) {
  requestAnimationFrame(loop);
  const dt = Math.min(time - lastTime, 33);
  lastTime = time;
  if (isRunning && !isPaused && !gameOver) {
    const steps = 2;
    for (let i = 0; i < steps; i++) stepPhysics();
    checkExits();
  }
  draw();
}

// ── 壁の追加 / 削除 ─────────────────────────────────────
function addWall(x1, y1, x2, y2) {
  var dx=x2-x1, dy=y2-y1;
  var len = Math.sqrt(dx*dx+dy*dy);
  if (len < 8) return;
  var cost = Math.floor(len * stage.wallCostPerPx);
  if (cost > remainingBudget) { flashBudget(); return; }
  userWalls.push({x1:x1, y1:y1, x2:x2, y2:y2});
  remainingBudget -= cost;
  updateUI();
}

function flashBudget() {
  var el = document.getElementById('budget-num');
  el.style.color = '#f55';
  setTimeout(function(){ el.style.color = '#f0ad4e'; }, 400);
}

function ptSegDist(px, py, x1, y1, x2, y2) {
  var dx=x2-x1, dy=y2-y1, lenSq=dx*dx+dy*dy;
  if (lenSq === 0) return Math.hypot(px-x1, py-y1);
  var t = Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/lenSq));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

function removeWallAt(x, y) {
  for (var i = userWalls.length-1; i >= 0; i--) {
    var w = userWalls[i];
    if (ptSegDist(x, y, w.x1, w.y1, w.x2, w.y2) < 14) {
      var len2 = Math.hypot(w.x2-w.x1, w.y2-w.y1);
      remainingBudget = Math.min(maxBudget, remainingBudget + Math.floor(len2 * stage.wallCostPerPx));
      userWalls.splice(i, 1);
      updateUI();
      return;
    }
  }
}

function getPos(e) {
  var rect = canvas.getBoundingClientRect();
  var src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (W / rect.width),
    y: (src.clientY - rect.top)  * (H / rect.height),
  };
}

canvas.addEventListener('mousedown', function(e) {
  var p = getPos(e);
  if (mode === 'draw') currentDraw = {x1:p.x, y1:p.y, x2:p.x, y2:p.y};
  else removeWallAt(p.x, p.y);
});
canvas.addEventListener('mousemove', function(e) {
  if (!currentDraw) return;
  var p = getPos(e);
  currentDraw.x2 = p.x; currentDraw.y2 = p.y;
});
canvas.addEventListener('mouseup', function(e) {
  if (!currentDraw) return;
  var p = getPos(e);
  addWall(currentDraw.x1, currentDraw.y1, p.x, p.y);
  currentDraw = null;
});
canvas.addEventListener('mouseleave', function() {
  if (currentDraw) { addWall(currentDraw.x1,currentDraw.y1,currentDraw.x2,currentDraw.y2); currentDraw=null; }
});
canvas.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  var p = getPos(e); removeWallAt(p.x, p.y);
});
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  var p = getPos(e);
  if (mode === 'draw') currentDraw = {x1:p.x, y1:p.y, x2:p.x, y2:p.y};
  else removeWallAt(p.x, p.y);
}, {passive:false});
canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!currentDraw) return;
  var p = getPos(e); currentDraw.x2=p.x; currentDraw.y2=p.y;
}, {passive:false});
canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  if (!currentDraw) return;
  var t = e.changedTouches[0];
  var rect = canvas.getBoundingClientRect();
  var x = (t.clientX - rect.left)*(W/rect.width);
  var y = (t.clientY - rect.top)*(H/rect.height);
  addWall(currentDraw.x1,currentDraw.y1,x,y);
  currentDraw=null;
}, {passive:false});

document.getElementById('btn-draw').onclick = function() {
  mode='draw';
  document.getElementById('btn-draw').classList.add('active');
  document.getElementById('btn-erase').classList.remove('active');
};
document.getElementById('btn-erase').onclick = function() {
  mode='erase';
  document.getElementById('btn-erase').classList.add('active');
  document.getElementById('btn-draw').classList.remove('active');
};
document.getElementById('btn-toggle').onclick = function() {
  if (gameOver) return;
  var btn = document.getElementById('btn-toggle');
  if (!isRunning) {
    isRunning=true; isPaused=false;
    spawnTimer = setInterval(spawnBall, stage.spawnInterval);
    btn.textContent='\u23f8 \u4e00\u6642\u505c\u6b62'; btn.style.background='#d9534f';
  } else if (!isPaused) {
    isPaused=true; clearInterval(spawnTimer);
    btn.textContent='\u25b6 \u518d\u958b'; btn.style.background='#5cb85c';
  } else {
    isPaused=false;
    spawnTimer = setInterval(spawnBall, stage.spawnInterval);
    btn.textContent='\u23f8 \u4e00\u6642\u505c\u6b62'; btn.style.background='#d9534f';
  }
};
document.getElementById('btn-reset').onclick = function() { initStage(); };

initStage();
</script>
</body>
</html>
