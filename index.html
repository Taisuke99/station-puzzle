<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ステーションパズル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    color: #fff;
    overflow: hidden;
    height: 100vh;
  }
  #ui {
    width: 400px;
    max-width: 100vw;
    padding: 8px 12px 4px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }
  #row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #aaa;
  }
  #row1 .val { font-size: 15px; color: #fff; font-weight: bold; }
  #mission {
    text-align: center;
    font-size: 13px;
    color: #7ec8e3;
  }
  #budget-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #aaa;
  }
  #budget-track {
    flex: 1;
    height: 6px;
    background: #333;
    border-radius: 3px;
    overflow: hidden;
  }
  #budget-fill {
    height: 100%;
    background: #f0ad4e;
    border-radius: 3px;
    transition: width 0.2s;
  }
  #budget-num { font-size: 13px; color: #f0ad4e; font-weight: bold; min-width: 44px; text-align: right; }
  #dir-section {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .dir-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #aaa;
    flex: 1;
    min-width: 120px;
  }
  .dir-ctrl label { white-space: nowrap; }
  .dir-ctrl input[type=range] {
    flex: 1;
    height: 4px;
    accent-color: #7ec8e3;
  }
  .dir-angle { font-size: 11px; color: #7ec8e3; min-width: 28px; text-align: right; }
  #controls {
    display: flex;
    gap: 6px;
    justify-content: center;
  }
  button {
    padding: 7px 12px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  button:active { transform: scale(0.95); }
  #btn-draw { background: #4a90d9; color: #fff; }
  #btn-erase { background: #e07070; color: #fff; }
  #btn-toggle { background: #5cb85c; color: #fff; }
  #btn-reset { background: #555; color: #ccc; }
  button.active { outline: 2px solid #fff; opacity: 1; }
  button:not(.active) { opacity: 0.7; }
  #canvas-wrap {
    position: relative;
    width: 400px;
    max-width: 100vw;
    flex-shrink: 0;
  }
  canvas {
    display: block;
    width: 400px;
    max-width: 100vw;
    cursor: crosshair;
    touch-action: none;
  }
  #overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.78);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border-radius: 4px;
  }
  #overlay.show { display: flex; }
  #overlay-title { font-size: 30px; font-weight: bold; }
  #overlay-sub { font-size: 14px; color: #ccc; }
  #overlay-btn {
    padding: 11px 28px;
    background: #5cb85c;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div id="ui">
  <div id="row1">
    <div>STAGE <span class="val" id="stage-num">1</span></div>
    <div>到達: <span class="val"><span id="exit-count">0</span> / <span id="target-num">5</span></span></div>
    <div>投入: <span class="val"><span id="spawned-num">0</span> / <span id="total-num">10</span></span></div>
  </div>
  <div id="mission">出口に <span id="m-target">5</span> 個送り込め！</div>
  <div id="budget-bar">
    <span>予算</span>
    <div id="budget-track"><div id="budget-fill" style="width:100%"></div></div>
    <span id="budget-num">300pt</span>
  </div>
  <div id="dir-section"><!-- 入口ごとに動的生成 --></div>
  <div id="controls">
    <button id="btn-draw" class="active">✏️ 描く</button>
    <button id="btn-erase">✂️ 消す</button>
    <button id="btn-toggle">▶ 開始</button>
    <button id="btn-reset">↺ リセット</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas" width="400" height="520"></canvas>
  <div id="overlay">
    <div id="overlay-title">🎉 クリア！</div>
    <div id="overlay-sub"></div>
    <button id="overlay-btn">次のステージへ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const { Engine, Bodies, Body, Composite } = Matter;

const W = 400, H = 520;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ── ステージ定義 ──────────────────────────────────────────
const STAGES = [
  {
    id: 1, totalBalls: 10, target: 5, spawnInterval: 1200, budget: 300,
    ballCost: 8, wallCostPerPx: 1.5,
    entrances: [{ x: 200, y: 28 }],
    exits: [{ x: 140, y: H - 10, w: 120, color: '#5cb85c', label: 'OUT' }],
    obstacles: [],
  },
  {
    id: 2, totalBalls: 15, target: 10, spawnInterval: 900, budget: 260,
    ballCost: 8, wallCostPerPx: 1.5,
    entrances: [{ x: 100, y: 28 }, { x: 300, y: 28 }],
    exits: [{ x: 155, y: H - 10, w: 90, color: '#f0ad4e', label: 'OUT' }],
    obstacles: [
      { x: 80,  y: 190, w: 80, h: 14, angle: 0.3 },
      { x: 280, y: 250, w: 80, h: 14, angle: -0.3 },
      { x: 175, y: 360, w: 60, h: 14, angle: 0 },
    ],
  },
  {
    id: 3, totalBalls: 20, target: 15, spawnInterval: 800, budget: 220,
    ballCost: 6, wallCostPerPx: 1.5,
    entrances: [{ x: 200, y: 28 }],
    exits: [
      { x: 60,  y: H - 10, w: 80, color: '#d9534f', label: 'A' },
      { x: 270, y: H - 10, w: 80, color: '#5bc0de', label: 'B' },
    ],
    obstacles: [
      { x: 200, y: 280, w: 16, h: 110, angle: 0 },
      { x: 90,  y: 400, w: 70, h: 14, angle: 0.2 },
      { x: 310, y: 400, w: 70, h: 14, angle: -0.2 },
    ],
  },
];

// ── 状態 ──────────────────────────────────────────────────
let stageIndex = 0;
let stage, engine, balls, wallBodies;
let mode = 'draw';
let isRunning = false, isPaused = false;
let spawnTimer = null;
let spawnedCount = 0, exitCount = 0;
let remainingBudget = 0, maxBudget = 0;
let currentDraw = null;
let userWalls = [];
let gameOver = false;
let entranceAngles = []; // radians per entrance, 0 = straight down

// ── 初期化 ──────────────────────────────────────────────────
function initStage() {
  if (engine) Engine.clear(engine);
  engine = Engine.create({ gravity: { y: 1.5 } });
  balls = []; wallBodies = []; userWalls = [];
  spawnedCount = 0; exitCount = 0;
  isRunning = false; isPaused = false; gameOver = false;
  currentDraw = null;
  clearInterval(spawnTimer);

  stage = STAGES[stageIndex];
  maxBudget = remainingBudget = stage.budget;
  entranceAngles = stage.entrances.map(() => 0);

  buildDirectionUI();
  updateUI();

  // 固定壁
  Composite.add(engine.world, [
    Bodies.rectangle(-5,   H / 2, 10, H, { isStatic: true }),
    Bodies.rectangle(W+5,  H / 2, 10, H, { isStatic: true }),
    Bodies.rectangle(W/2,  H+5,  W, 10, { isStatic: true }),
  ]);

  // 障害物
  stage.obstacles.forEach(o => {
    const b = Bodies.rectangle(o.x, o.y, o.w, o.h, {
      isStatic: true, angle: o.angle || 0, friction: 0.3, restitution: 0.4,
    });
    Composite.add(engine.world, b);
    wallBodies.push({ body: b, isObstacle: true });
  });

  document.getElementById('overlay').classList.remove('show');
  document.getElementById('btn-toggle').textContent = '▶ 開始';
  document.getElementById('btn-toggle').style.background = '#5cb85c';
  requestAnimationFrame(loop);
}

// ── 射出方向UI ────────────────────────────────────────────
function buildDirectionUI() {
  const sec = document.getElementById('dir-section');
  sec.innerHTML = '';
  stage.entrances.forEach((e, i) => {
    const label = stage.entrances.length > 1 ? `入口${i+1}` : '射出角';
    const div = document.createElement('div');
    div.className = 'dir-ctrl';
    const lbl = document.createElement('label');
    lbl.textContent = label;
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = -60; slider.max = 60; slider.value = 0; slider.step = 5;
    const angleSpan = document.createElement('span');
    angleSpan.className = 'dir-angle';
    angleSpan.textContent = '0°';
    slider.addEventListener('input', () => {
      const deg = parseInt(slider.value);
      entranceAngles[i] = deg * Math.PI / 180;
      angleSpan.textContent = deg + '°';
    });
    div.appendChild(lbl);
    div.appendChild(slider);
    div.appendChild(angleSpan);
    sec.appendChild(div);
  });
}

// ── UI更新 ────────────────────────────────────────────────
function updateUI() {
  document.getElementById('stage-num').textContent    = stage.id;
  document.getElementById('target-num').textContent   = stage.target;
  document.getElementById('total-num').textContent    = stage.totalBalls;
  document.getElementById('m-target').textContent     = stage.target;
  document.getElementById('exit-count').textContent   = exitCount;
  document.getElementById('spawned-num').textContent  = spawnedCount;
  const pct = Math.max(0, remainingBudget / maxBudget * 100);
  document.getElementById('budget-fill').style.width  = pct + '%';
  document.getElementById('budget-fill').style.background = pct > 40 ? '#f0ad4e' : '#e07070';
  document.getElementById('budget-num').textContent   = Math.max(0, remainingBudget) + 'pt';
}

// ── スポーン ──────────────────────────────────────────────
function spawnBall() {
  if (gameOver) return;
  if (spawnedCount >= stage.totalBalls) {
    clearInterval(spawnTimer);
    setTimeout(checkEnd, 3000);
    return;
  }
  if (remainingBudget < stage.ballCost) {
    // 予算切れ — 強制終了
    clearInterval(spawnTimer);
    setTimeout(checkEnd, 2000);
    return;
  }
  const idx = spawnedCount % stage.entrances.length;
  const src = stage.entrances[idx];
  const angle = entranceAngles[idx] || 0;
  const speed = 3;
  const jitter = (Math.random() - 0.5) * 8;
  const r = 10;
  const hues = [220, 160, 40, 0, 280, 180];
  const hue = hues[spawnedCount % hues.length];
  const ball = Bodies.circle(src.x + jitter, src.y, r, {
    restitution: 0.4, friction: 0.15, frictionAir: 0.01, label: 'ball', _hue: hue,
  });
  Body.setVelocity(ball, {
    x: Math.sin(angle) * speed + (Math.random() - 0.5) * 0.5,
    y: Math.cos(angle) * speed,
  });
  Composite.add(engine.world, ball);
  balls.push(ball);
  spawnedCount++;
  remainingBudget -= stage.ballCost;
  updateUI();
}

function checkEnd() {
  if (gameOver) return;
  gameOver = true;
  clearInterval(spawnTimer);
  showResult();
}

function showResult() {
  const overlay = document.getElementById('overlay');
  const title   = document.getElementById('overlay-title');
  const sub     = document.getElementById('overlay-sub');
  const btn     = document.getElementById('overlay-btn');
  if (exitCount >= stage.target) {
    title.textContent = '🎉 クリア！';
    title.style.color = '#7ec8e3';
    sub.textContent   = `${exitCount} 個を出口に送り込んだ！`;
    if (stageIndex < STAGES.length - 1) {
      btn.textContent = '次のステージへ →';
      btn.onclick = () => { stageIndex++; initStage(); };
    } else {
      btn.textContent = '🏆 全ステージ完了！';
      btn.onclick = () => { stageIndex = 0; initStage(); };
    }
  } else {
    title.textContent = '😓 もう一度！';
    title.style.color = '#e07070';
    sub.textContent   = `${exitCount} 個しか届かなかった（目標: ${stage.target}）`;
    btn.textContent   = 'リトライ →';
    btn.onclick       = () => initStage();
  }
  overlay.classList.add('show');
}

// ── 出口判定 ──────────────────────────────────────────────
function checkExits() {
  balls = balls.filter(ball => {
    const p = ball.position;
    for (const exit of stage.exits) {
      const ex1 = exit.x - exit.w / 2, ex2 = exit.x + exit.w / 2;
      if (p.y > H - 35 && p.x >= ex1 && p.x <= ex2) {
        Composite.remove(engine.world, ball);
        exitCount++;
        updateUI();
        if (!gameOver && exitCount >= stage.target && spawnedCount >= stage.totalBalls) {
          gameOver = true; clearInterval(spawnTimer);
          setTimeout(showResult, 600);
        }
        return false;
      }
    }
    if (p.y > H + 50) {
      Composite.remove(engine.world, ball);
      if (!gameOver && spawnedCount >= stage.totalBalls && balls.length <= 1) {
        gameOver = true; setTimeout(showResult, 400);
      }
      return false;
    }
    return true;
  });
}

// ── 描画 ──────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0f0f1e';
  ctx.fillRect(0, 0, W, H);

  // グリッド
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // 入口 + 方向矢印
  stage.entrances.forEach((e, i) => {
    ctx.strokeStyle = '#7ec8e3'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, 13, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(126,200,227,0.12)'; ctx.fill();
    ctx.fillStyle = '#7ec8e3'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('IN', e.x, e.y + 3);
    // 方向矢印
    const ang = entranceAngles[i] || 0;
    const len = 22;
    const ax = e.x + Math.sin(ang) * len, ay = e.y + Math.cos(ang) * len;
    ctx.strokeStyle = 'rgba(126,200,227,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(ax, ay); ctx.stroke();
    // 矢印先端
    const headAng = Math.atan2(ay - e.y, ax - e.x);
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 7*Math.cos(headAng - 0.4), ay - 7*Math.sin(headAng - 0.4));
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 7*Math.cos(headAng + 0.4), ay - 7*Math.sin(headAng + 0.4));
    ctx.stroke();
  });

  // 出口
  stage.exits.forEach(exit => {
    const x1 = exit.x - exit.w / 2;
    ctx.fillStyle = exit.color + '33'; ctx.fillRect(x1, H-26, exit.w, 26);
    ctx.strokeStyle = exit.color; ctx.lineWidth = 3; ctx.strokeRect(x1, H-26, exit.w, 26);
    ctx.fillStyle = exit.color; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(exit.label, exit.x, H - 9);
  });

  // 障害物
  wallBodies.forEach(w => {
    if (!w.isObstacle) return;
    const b = w.body;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    const hw = (b.bounds.max.x - b.bounds.min.x) / 2;
    const hh = (b.bounds.max.y - b.bounds.min.y) / 2;
    ctx.fillStyle = '#c05020';
    ctx.fillRect(-hw, -hh, hw*2, hh*2);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2;
    for (let s = -hw*2; s < hw*2; s += 10) {
      ctx.beginPath(); ctx.moveTo(s, -hh); ctx.lineTo(s - hh*2, hh); ctx.stroke();
    }
    ctx.restore();
  });

  // ユーザー壁
  userWalls.forEach(w => {
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(w.x1, w.y1, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(w.x2, w.y2, 3, 0, Math.PI*2); ctx.fill();
  });

  // 描画プレビュー
  if (currentDraw) {
    const { x1,y1,x2,y2 } = currentDraw;
    const dx = x2-x1, dy = y2-y1;
    const len = Math.sqrt(dx*dx+dy*dy);
    const cost = Math.floor(len * stage.wallCostPerPx);
    ctx.strokeStyle = remainingBudget >= cost ? 'rgba(255,255,255,0.55)' : 'rgba(255,80,80,0.7)';
    ctx.lineWidth = 3; ctx.setLineDash([6,4]); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.setLineDash([]);
    // コスト表示
    if (len > 20) {
      ctx.fillStyle = cost <= remainingBudget ? '#fff' : '#f66';
      ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`-${cost}pt`, (x1+x2)/2, (y1+y2)/2 - 8);
    }
  }

  // 玉
  balls.forEach(ball => {
    const p = ball.position;
    const hue = ball._hue || 220;
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI*2);
    const g = ctx.createRadialGradient(p.x-3, p.y-3, 1, p.x, p.y, 10);
    g.addColorStop(0, `hsl(${hue},80%,80%)`);
    g.addColorStop(1, `hsl(${hue},70%,50%)`);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = `hsl(${hue},60%,40%)`; ctx.lineWidth = 1; ctx.stroke();
  });

  // 予算切れ警告
  if (remainingBudget <= 0 && !gameOver) {
    ctx.fillStyle = 'rgba(255,80,80,0.18)';
    ctx.fillRect(0, 0, W, H);
  }
}

// ── ゲームループ ──────────────────────────────────────────
let lastTime = 0;
function loop(time) {
  const dt = Math.min(time - lastTime, 32);
  lastTime = time;
  if (isRunning && !isPaused && !gameOver) {
    Engine.update(engine, dt);
    checkExits();
  }
  draw();
  requestAnimationFrame(loop);
}

// ── 壁の追加 / 削除 ──────────────────────────────────────
function addWall(x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1;
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len < 10) return;
  const cost = Math.floor(len * stage.wallCostPerPx);
  if (cost > remainingBudget) { flashBudget(); return; }
  const cx = (x1+x2)/2, cy = (y1+y2)/2;
  const angle = Math.atan2(dy, dx);
  const body = Bodies.rectangle(cx, cy, len, 6, {
    isStatic: true, angle, friction: 0.3, restitution: 0.4, label: 'userWall',
  });
  Composite.add(engine.world, body);
  userWalls.push({ x1, y1, x2, y2
